name: Build & Deploy (trip - deploy-test)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (skip tests)
        run: ./gradlew clean build -x test

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push
        run: |
          REPO=${{ secrets.DOCKER_USERNAME }}/retrip-trip
          docker build -t $REPO:deploy-test -t $REPO:deploy-test-${{ github.sha }} .
          docker push $REPO:deploy-test
          docker push $REPO:deploy-test-${{ github.sha }}

  open-ssh:
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      cidr: ${{ steps.cidr.outputs.cidr }}
      rule_id: ${{ steps.add.outputs.rule_id }}
    steps:
      - name: Get egress IPv4
        id: egress
        run: |
          IP=$(curl -s https://checkip.amazonaws.com | tr -d '\r\n')
          if [ -z "$IP" ]; then echo "Failed to get egress IP"; exit 1; fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "EGRESS IPv4: $IP"

      - name: Decide CIDR
        id: cidr
        run: |
          CIDR="${{ steps.egress.outputs.ip }}/32"
          echo "cidr=$CIDR" >> "$GITHUB_OUTPUT"
          echo "Using CIDR: $CIDR"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          # 임시키(STS)를 쓸 경우 아래도 추가
          # aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Allow SSH temporarily (22/tcp) and capture rule-id
        id: add
        run: |
          CIDR="${{ steps.cidr.outputs.cidr }}"
          echo "Authorizing $CIDR on SG ${{ secrets.AWS_SECURITY_GROUP_ID }}"
          OUT=$(aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "$CIDR" \
            --output json 2>&1) || true
          echo "$OUT"
          # rule-id 추출(신규 규칙이면 반환됨)
          RID=$(echo "$OUT" | jq -r '.SecurityGroupRules[0].SecurityGroupRuleId // empty')
          echo "rule_id=$RID" >> "$GITHUB_OUTPUT"
          # 중복 규칙일 수도 있으므로 실패로 간주하지 않음
      - name: Wait for SG propagation
        run: sleep 8

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - open-ssh
    steps:
      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Debug mapping: EC2_HOST ↔ Instance ↔ SGs
        run: |
          HOST='${{ secrets.EC2_HOST }}'
          echo "EC2_HOST=$HOST"
          aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$HOST" "Name=private-ip-address,Values=$HOST" \
            --query 'Reservations[].Instances[].{Id:InstanceId, SGs:SecurityGroups[].GroupId}' \
            --output table

          echo "We modify SG: ${{ secrets.AWS_SECURITY_GROUP_ID }}"
          aws ec2 describe-security-groups --group-ids "${{ secrets.AWS_SECURITY_GROUP_ID }}" --output table

      - name: Probe 22/tcp from runner
        run: |
          timeout 5 bash -c "echo > /dev/tcp/${{ secrets.EC2_HOST }}/22" && echo "22 open" || (echo "22 closed"; exit 1)

      - name: Deploy trip via compose (partial update)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            cd ~/all-in-one
            test -f docker-compose.yml || (echo "compose file not found"; ls -la; exit 1)
            docker compose pull trip
            docker compose up -d trip
            docker compose ps

  close-ssh:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - deploy
      - open-ssh
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          # 임시키(STS)를 쓸 경우 아래도 추가
          # aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Revoke SSH by rule-id (preferred)
        run: |
          RID="${{ needs.open-ssh.outputs.rule_id }}"
          CIDR="${{ needs.open-ssh.outputs.cidr }}"
          if [ -n "$RID" ]; then
            echo "Revoking rule-id $RID"
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
              --security-group-rule-ids "$RID" || echo "rule-id not found; continuing."
          elif [ -n "$CIDR" ]; then
            echo "No rule-id; fallback revoke by CIDR $CIDR"
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
              --protocol tcp --port 22 --cidr "$CIDR" || echo "CIDR rule not found; continuing."
          else
            echo "No rule-id or CIDR captured; skipping revoke."
          fi
