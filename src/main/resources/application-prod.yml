spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

cloud:
  aws:
    region: ap-northeast-2
  s3:
    bucket: retrip-media

apis:
  auth:
    url: ${APIS_AUTH_URL:http://localhost:18082/}
  alarm:
    url: ${APIS_ALARM_URL:http://localhost:8082/}
